# ============================================================
# CSV Data Editor — application configuration
#
# Swap auth or storage providers by changing `provider:` below.
# Each provider reads only its own settings block, so unused
# blocks can stay in the file as documentation.
# ============================================================

app:
  title: "Data Editor"
  subtitle: "sign in to edit the dataset"

# ------------------------------------------------------------
# AUTH — pick one: mock | gcloud_identity | google_oauth | gcp_iap
# (register more in providers/auth/__init__.py)
#
# For the 988 GCP deployment: set provider: google_oauth (or gcp_iap, if
# the app sits behind an Identity-Aware Proxy load balancer) below — or
# point CSV_EDITOR_CONFIG at a separate deployment config file that does.
# Kept as mock here so `streamlit run app.py` and the test suite work with
# zero GCP setup. See README.md's "GCP deployment" section.
# ------------------------------------------------------------
auth:
  provider: mock

  mock:
    # Dev-only users. NEVER use in production.
    users:
      admin: "admin"
      editor: "editor"

  gcloud_identity:
    # Google Cloud Identity Platform (email+password sign-in).
    # https://cloud.google.com/identity-platform/docs/use-rest-api
    # Set the API key via env var GCP_IDENTITY_API_KEY (preferred)
    # or inline here (not recommended for committed files).
    api_key_env: GCP_IDENTITY_API_KEY
    # api_key: "..."           # inline fallback (avoid committing)

  google_oauth:
    # Full OAuth authorization-code flow, run by this app itself.
    # https://developers.google.com/identity/protocols/oauth2/web-server
    client_id_env: GOOGLE_OAUTH_CLIENT_ID
    client_secret_env: GOOGLE_OAUTH_CLIENT_SECRET
    # client_id / client_secret: "..."   # inline fallback (avoid committing)
    redirect_uri: https://<your-cloud-run-service>/   # must exactly match the
                                                        # OAuth client's authorized
                                                        # redirect URI in Google
                                                        # Cloud Console

  gcp_iap:
    # Google Cloud Identity-Aware Proxy — a load balancer in front of the
    # app handles Google sign-in and forwards a signed identity JWT on
    # every request; the app never renders a login form.
    # https://cloud.google.com/iap/docs/concepts-overview
    audience_env: IAP_AUDIENCE
    # audience: "..."   # inline fallback (avoid committing)
    #   Format: /projects/PROJECT_NUMBER/global/backendServices/SERVICE_ID
    #   https://cloud.google.com/iap/docs/signed-headers-howto#verifying_the_jwt_payload

# ------------------------------------------------------------
# STORAGE — pick one: local_csv | bigquery | gcs_parquet
# (register more in providers/storage/__init__.py)
#
# For the 988 GCP deployment: set provider: gcs_parquet below (or point
# CSV_EDITOR_CONFIG at a separate deployment config file that does) — kept
# as local_csv here so `streamlit run app.py` and the test suite work with
# zero GCP setup. See README.md's "GCP deployment" section.
# ------------------------------------------------------------
storage:
  provider: local_csv

  local_csv:
    path: sample_data/resources.csv
    id_column: null          # null → use file row order as the row id

  bigquery:
    project: my-gcp-project
    dataset: my_dataset
    table: resources
    id_column: id            # a stable unique key column is REQUIRED
    # Optional: audit table for the post-publish metadata write.
    # One row per changed cell (row id, column, old, new, timestamp, user,
    # last_updated_at/by). Omit to skip the audit write.
    audit_table: resources_audit
    # Auth uses Application Default Credentials:
    #   gcloud auth application-default login
    # or GOOGLE_APPLICATION_CREDENTIALS=/path/to/sa.json
    location: US

  gcs_parquet:
    # A single parquet object on GCS — read/written in-memory, no local
    # temp files (see providers/storage/gcs_parquet.py).
    bucket: collab-nprod-data
    blob_path: collaborator_988_raw/raw_crisis_988_data/geo_coded_988_data.parquet
    id_column: null           # null → use file row order as the row id
    # Change-log audit trail (BigQuery). Same 17 columns as the dataset,
    # plus change_id/change_state/change_type/changed_by/changed_at — see
    # core/audit.py. Written BEFORE the parquet write on every publish.
    change_log:
      project: collab-infra-nprod
      dataset: collaborator_988_raw
      table: 988_change_log
      location: US
    # Auth uses Application Default Credentials, same as bigquery above.

# ------------------------------------------------------------
# DATASET — display name + column definitions.
# `type` drives BOTH the cell editor and validation:
#   text | textarea | enum (options) | float (min/max)
# required-but-blank cells are flagged (amber) but do NOT block
# publish; format/type failures DO block publish.
# ------------------------------------------------------------
dataset:
  display_name: resources.csv
  columns:
    # Editor type per column: text | textarea | enum | float
    # required-but-blank cells are flagged (amber) but do NOT block
    # publish; format/type failures DO block publish.
    - name: service_category
      label: SERVICE_CATEGORY
      type: enum
      required: true
      options:
        - "211 and Other Resource Databases"
        - "811 and Health Information"
        - "Child Protection Services"
        - "Crisis Lines: International"
        - "Crisis Lines: Local"
        - "Crisis Lines: National"
        - "Crisis Lines: Provincial/Territorial"
        - "Mobile Crisis Teams"
        - "Poison Control"

    - name: name
      label: NAME
      type: text
      required: true

    - name: address
      label: ADDRESS
      type: text

    - name: city_town
      label: CITY_TOWN
      type: text
      required: true

    - name: province_territory
      label: PROVINCE_TERRITORY
      type: enum
      required: true
      options:
        - Alberta
        - British Columbia
        - Manitoba
        - New Brunswick
        - Newfoundland and Labrador
        - Northwest Territories
        - Nova Scotia
        - Nunavut
        - Ontario
        - Prince Edward Island
        - Quebec
        - Saskatchewan
        - Yukon

    - name: postal_code
      label: POSTAL_CODE
      type: text
      normalize: postal_code        # auto-trim + normalise internal space
      regex: "^[A-Za-z][0-9][A-Za-z] [0-9][A-Za-z][0-9]$"
      regex_hint: "must match A1A 1A1"

    - name: phone_1
      label: PHONE_1
      type: text
      required: true                # blanks flagged, not blocked; mixed
                                    # formats in the data, so no regex

    - name: phone_2
      label: PHONE_2
      type: text

    - name: phone_3
      label: PHONE_3
      type: text

    - name: website
      label: WEBSITE
      type: text
      regex: "^https?://.+"
      regex_hint: "must start with http:// or https://"

    - name: coverage_area
      label: COVERAGE_AREA
      type: text

    # 24/7 or per-day list: "Mo 8:00-19:00,Tu 8:00-19:00,..."
    - name: hours_call
      label: HOURS_CALL
      type: text

    - name: hours_sms
      label: HOURS_SMS
      type: text

    - name: hours_chat
      label: HOURS_CHAT
      type: text

    - name: description
      label: DESCRIPTION
      type: textarea

    - name: latitude
      label: LATITUDE
      type: float
      required: true
      min: -90
      max: 90

    - name: longitude
      label: LONGITUDE
      type: float
      required: true
      min: -180
      max: 180
